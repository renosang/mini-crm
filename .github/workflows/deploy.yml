name: Deploy Mini CRM to VPS

on:
  push:
    branches:
      - main # Nhánh tự động deploy khi push

jobs:
  # Job 1: Chỉ thực hiện Build dự án và đóng gói
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Compress files for transfer
        # Đóng gói tất cả các file chạy backend & frontend đã build
        run: |
          tar -czf deploy.tar.gz dist api server.ts loadEnv.ts package.json package-lock.json tsconfig.json tsconfig.node.json

      - name: Upload build artifact
        # Đẩy gói build lên hệ thống lưu trữ tạm thời của Github Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy.tar.gz
          retention-days: 1 # Chỉ lưu trữ tạm thời 1 ngày

  # Job 2: Tải gói build từ Job 1 xuống và chuyển/deploy lên VPS
  deploy:
    runs-on: ubuntu-latest
    needs: build # Yêu cầu job build hoàn thành trước
    steps:
      - name: Download build artifact
        # Tải file nén deploy.tar.gz được lưu trữ từ job build xuống
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Copy build artifacts to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/var/www/mini-crm"

      - name: Extract and restart app on VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Nạp môi trường Node.js & PM2 (do SSH không tự động tải .bashrc/.profile)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Khai báo PATH dự phòng
            export PATH=$PATH:/usr/local/bin:/usr/bin
            
            cd /var/www/mini-crm
            # Giải nén đè lên các file cũ
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # Cài đặt các thư viện mới
            npm install
            
            # Restart ứng dụng bằng PM2 dưới port 5004
            export PORT=5004
            export NODE_ENV=production
            
            if pm2 describe mini-crm > /dev/null 2>&1; then
              PORT=5004 pm2 reload mini-crm --update-env
            else
              PORT=5004 pm2 start npx --name "mini-crm" -- tsx server.ts
            fi
            
            # Lưu cấu hình PM2
            pm2 save
